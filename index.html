<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Question</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <!-- Tracking.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="app-container">
        <!-- Main Video Feed -->
        <video id="webcam" autoplay muted playsinline></video>
        <!-- Canvas for debugging tracking (optional, usually hidden in final, but good for setup) -->
        <canvas id="tracking-canvas"></canvas>

        <!-- UI Layer -->
        <div id="ui-layer">
            
            <!-- Setup Zones -->
            <div id="yes-zone" class="zone">YES ZONE</div>
            <div id="no-zone" class="zone">NO ZONE</div>

            <!-- Setup Controls -->
            <div id="controls">
                <h1>Configuration Protocol</h1>
                <p>1. Grant Camera Permissions.<br>
                   2. Drag & Resize the "YES" (Green) and "NO" (Red) zones to the pockets.<br>
                   3. Click the ball on the video to sample its color.<br>
                   4. Press START to arm the system.</p>
                <div id="color-sample-display" style="width: 30px; height: 30px; border: 1px solid white; margin: 10px auto; background: transparent;"></div>
                <button id="start-btn">Start System</button>
            </div>

            <!-- Active Indicator -->
            <div id="status-indicator">SYSTEM ARMED - TRACKING ACTIVE</div>

        </div>
    </div>

    <!-- Overlays -->
    <div id="active-overlay">
        <div id="message-text"></div>
    </div>

    <div id="toast" class="toast">Glitch in the simulation. Try again.</div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
